<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Etymap</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css"/>
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,wght@0,300;0,400;0,500;0,600;1,300&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet"/>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
:root{
  --bg:#0f1117;--surface:#181c27;--surface2:#1e2333;
  --border:rgba(255,255,255,0.08);--accent:#4ade9e;
  --accent-dim:rgba(74,222,158,0.1);--blue:#60a5fa;
  --blue-dim:rgba(96,165,250,0.1);--warn:#f59e0b;
  --danger:#f87171;--text:#e8eaf0;--text2:#8b90a0;--text3:#4a4f60;
}
body{font-family:'DM Sans',sans-serif;background:var(--bg);color:var(--text);height:100vh;height:100dvh;display:flex;flex-direction:column;overflow:hidden;}
#header{display:flex;align-items:center;justify-content:space-between;padding:0 16px;height:48px;background:var(--surface);border-bottom:1px solid var(--border);flex-shrink:0;gap:12px;}
#logo{font-size:17px;font-weight:600;letter-spacing:-0.3px;white-space:nowrap;}
#logo span{color:var(--accent);}
#header-mid{display:flex;align-items:center;gap:10px;flex:1;justify-content:center;}
#streak-badge{font-size:13px;color:var(--warn);font-family:'DM Mono',monospace;}
#puzzle-num{font-size:11px;color:var(--text3);font-family:'DM Mono',monospace;}
#mode-toggle{display:flex;background:var(--bg);border:1px solid var(--border);border-radius:6px;overflow:hidden;flex-shrink:0;}
.mode-btn{padding:5px 12px;border:none;font-family:'DM Sans',sans-serif;font-size:12px;font-weight:500;cursor:pointer;background:none;color:var(--text2);transition:all 0.15s;}
.mode-btn.active{background:var(--surface2);color:var(--text);}
#clue-panel{padding:12px 16px 10px;background:var(--surface);border-bottom:1px solid var(--border);flex-shrink:0;}
#clue-label{font-size:10px;font-weight:600;letter-spacing:2px;text-transform:uppercase;color:var(--text3);margin-bottom:4px;}
#clue-text{font-size:24px;font-weight:300;font-style:italic;color:var(--text);line-height:1.2;}
#clue-type{font-size:12px;color:var(--text3);margin-top:2px;}
#hint-bar{display:flex;align-items:center;gap:8px;padding:8px 16px;background:var(--surface);border-bottom:1px solid var(--border);flex-shrink:0;flex-wrap:wrap;}
#hint-label{font-size:11px;color:var(--text3);flex-shrink:0;}
.hint-chip{padding:4px 10px;border-radius:20px;border:1px solid var(--border);font-size:11px;font-weight:500;cursor:pointer;background:none;color:var(--text2);font-family:'DM Sans',sans-serif;transition:all 0.15s;white-space:nowrap;}
.hint-chip:hover:not(:disabled){border-color:var(--blue);color:var(--blue);background:var(--blue-dim);}
.hint-chip:disabled{opacity:0.25;cursor:not-allowed;}
.chip-cost{color:var(--danger);font-size:10px;margin-left:3px;}
#hint-shown{font-size:12px;color:var(--blue);font-style:italic;}
#map{flex:1;cursor:crosshair;}
#bottom{background:var(--surface);border-top:1px solid var(--border);flex-shrink:0;}
#bottom-pre{display:flex;align-items:center;justify-content:space-between;padding:10px 16px;gap:12px;}
#pin-msg{font-size:12px;color:var(--text3);font-style:italic;flex:1;}
#confirm-btn{padding:9px 22px;background:var(--accent);color:#071a0f;border:none;border-radius:7px;font-family:'DM Sans',sans-serif;font-size:13px;font-weight:600;cursor:pointer;transition:all 0.15s;display:none;white-space:nowrap;}
#confirm-btn:hover{background:#6ee7b3;}
#result-panel{display:none;padding:14px 16px;flex-direction:column;gap:10px;}
#result-top{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;}
#result-score{font-size:38px;font-weight:300;font-family:'DM Mono',monospace;color:var(--accent);letter-spacing:-2px;line-height:1;}
#result-label{font-size:11px;color:var(--text3);letter-spacing:1px;margin-top:2px;}
#result-breakdown{font-size:11px;color:var(--text2);font-family:'DM Mono',monospace;line-height:1.8;text-align:right;white-space:pre;}
#result-answer{border-top:1px solid var(--border);padding-top:10px;}
#result-place-name{font-size:17px;font-weight:600;color:var(--text);margin-bottom:2px;}
#result-country{font-size:12px;color:var(--text2);margin-bottom:8px;}
#etymology-card{background:var(--accent-dim);border:1px solid rgba(74,222,158,0.15);border-radius:8px;padding:10px 12px;font-size:12px;color:var(--text2);line-height:1.6;margin-bottom:8px;}
#result-actions{display:flex;gap:8px;}
#share-btn{flex:1;padding:9px;background:none;border:1px solid var(--border);border-radius:7px;font-family:'DM Sans',sans-serif;font-size:13px;font-weight:500;color:var(--text2);cursor:pointer;transition:all 0.15s;}
#share-btn:hover{border-color:var(--accent);color:var(--accent);}
#next-btn{flex:1;padding:9px;background:var(--surface2);border:1px solid var(--border);border-radius:7px;font-family:'DM Sans',sans-serif;font-size:13px;font-weight:500;color:var(--text);cursor:pointer;transition:all 0.15s;display:none;}
#next-btn:hover{border-color:var(--text2);}
#share-toast{position:fixed;bottom:80px;left:50%;transform:translateX(-50%) translateY(20px);background:var(--surface2);border:1px solid var(--border);border-radius:8px;padding:10px 18px;font-size:13px;color:var(--accent);opacity:0;pointer-events:none;transition:all 0.3s;white-space:nowrap;z-index:9999;}
#share-toast.show{opacity:1;transform:translateX(-50%) translateY(0);}
.leaflet-container{background:#1a1f2e !important;cursor:crosshair !important;}
.leaflet-control-zoom a{background:var(--surface) !important;color:var(--text) !important;border-color:var(--border) !important;}
.guess-dot{width:14px;height:14px;background:var(--accent);border:2px solid #fff;border-radius:50%;box-shadow:0 0 8px rgba(74,222,158,0.5);}
.answer-dot{width:14px;height:14px;background:var(--danger);border:2px solid #fff;border-radius:50%;box-shadow:0 0 8px rgba(248,113,113,0.5);}
@media(max-width:600px){
  #main{display:flex;flex-direction:column;flex:1;overflow:hidden;}
  #map{order:1;height:42dvh;min-height:180px;flex-shrink:0;}
  #panel{order:2;flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;display:flex;flex-direction:column;background:var(--surface);}
  #clue-text{font-size:20px;}
  #puzzle-num{display:none;}
}
@media(min-width:601px){
  #main{display:flex;flex:1;overflow:hidden;}
  #panel{width:300px;flex-shrink:0;display:flex;flex-direction:column;overflow-y:auto;background:var(--surface);border-right:1px solid var(--border);}
  #map{flex:1;}
  #bottom{margin-top:auto;border-top:1px solid var(--border);}
}
</style>
</head>
<body>
<div id="header">
  <div id="logo">etym<span>ap</span></div>
  <div id="header-mid">
    <div id="puzzle-num"></div>
    <div id="streak-badge"></div>
  </div>
  <div id="mode-toggle">
    <button class="mode-btn active" onclick="setMode('daily')">Daily</button>
    <button class="mode-btn" onclick="setMode('practice')">Practice</button>
  </div>
</div>
<div id="main">
  <div id="panel">
    <div id="clue-panel">
      <div id="clue-label">What place name means&hellip;</div>
      <div id="clue-text">Loading&hellip;</div>
      <div id="clue-type"></div>
    </div>
    <div id="hint-bar">
      <span id="hint-label">Hint:</span>
      <button class="hint-chip" id="btn-continent" onclick="useHint('continent')">Continent <span class="chip-cost">-150</span></button>
      <button class="hint-chip" id="btn-country" onclick="useHint('country')">Country <span class="chip-cost">-500</span></button>
      <span id="hint-shown"></span>
    </div>
    <div id="bottom">
      <div id="bottom-pre">
        <div id="pin-msg">Click the map to place your pin</div>
        <button id="confirm-btn" onclick="confirmGuess()">Confirm &rarr;</button>
      </div>
      <div id="result-panel">
        <div id="result-top">
          <div><div id="result-score">0</div><div id="result-label"></div></div>
          <div id="result-breakdown"></div>
        </div>
        <div id="result-answer">
          <div id="result-place-name"></div>
          <div id="result-country"></div>
          <div id="etymology-card"></div>
        </div>
        <div id="result-actions">
          <button id="share-btn" onclick="shareResult()">Share</button>
          <button id="next-btn" onclick="nextPuzzle()">Next &rarr;</button>
        </div>
      </div>
    </div>
  </div>
  <div id="map"></div>
</div>
<div id="share-toast">Copied to clipboard!</div>
<script>
const LAUNCH_DATE=new Date('2026-04-23');
const PUZZLES=[
  {place:"Reykjavik",country:"IS",continent:"Europe",translation:"Smoky Bay",type:"Capital city",etymology:"From Old Norse 'reykr' (smoke) and 'vik' (bay). Early settlers saw steam from geothermal hot springs and mistook it for smoke — giving Iceland's future capital a name based on a misunderstanding.",lat:64.13,lng:-21.93},
  {place:"Singapore",country:"SG",continent:"Asia",translation:"Lion City",type:"City-state",etymology:"From Sanskrit 'Simhapura' — simha (lion) + pura (city). A 14th-century Malay prince supposedly spotted a lion on landing. Lions never lived there; it was almost certainly a tiger.",lat:1.35,lng:103.82},
  {place:"Kuala Lumpur",country:"MY",continent:"Asia",translation:"Muddy Confluence",type:"Capital city",etymology:"From Malay 'kuala' (river mouth) and 'lumpur' (mud). Named for the murky meeting point of the Klang and Gombak rivers, where Chinese tin miners first settled in the 1850s.",lat:3.14,lng:101.69},
  {place:"Nairobi",country:"KE",continent:"Africa",translation:"Cool Water",type:"Capital city",etymology:"Shortened from Maasai 'Enkare Nairobi' (place of cool waters). A cold stream once ran through the area before the British built a railway depot here in 1899.",lat:-1.29,lng:36.82},
  {place:"Addis Ababa",country:"ET",continent:"Africa",translation:"New Flower",type:"Capital city",etymology:"Named in Amharic by Empress Taytu Betul in 1886 while her husband was away. She chose both the site and the name, reportedly charmed by the surrounding wildflowers.",lat:9.03,lng:38.74},
  {place:"Buenos Aires",country:"AR",continent:"South America",translation:"Good Winds",type:"Capital city",etymology:"Short for 'Puerto de Santa Maria de los Buenos Aires' — the good winds sailors prayed for on the Atlantic crossing. The city was founded twice; the first settlement was abandoned after indigenous attacks.",lat:-34.60,lng:-58.38},
  {place:"Ulaanbaatar",country:"MN",continent:"Asia",translation:"Red Hero",type:"Capital city",etymology:"From Mongolian for 'red hero'. Renamed in 1924 after the Mongolian Revolution. The city was previously a nomadic monastery that moved location 28 times before settling here.",lat:47.91,lng:106.88},
  {place:"Islamabad",country:"PK",continent:"Asia",translation:"City of Islam",type:"Capital city",etymology:"From Arabic/Persian — 'Islam' and 'abad' (inhabited place). Purpose-built in the 1960s to replace Karachi, designed by Greek architect Constantinos Doxiadis on a grid system.",lat:33.72,lng:73.06},
  {place:"Phnom Penh",country:"KH",continent:"Asia",translation:"Hill of Penh",type:"Capital city",etymology:"Named after Daun Penh (Grandmother Penh) who, legend says, found four Buddha statues on a riverside hill around 1372 and built a temple there — giving the hill, and later the city, its name.",lat:11.56,lng:104.93},
  {place:"Ouagadougou",country:"BF",continent:"Africa",translation:"You are welcome here at home with us",type:"Capital city",etymology:"From the Mossi language — a phrase of communal welcome. Its airport code OUA is considered one of the most satisfying to say aloud. The city was capital of the Mossi Kingdom for centuries.",lat:12.37,lng:-1.53},
  {place:"Montevideo",country:"UY",continent:"South America",translation:"I saw a mountain",type:"Capital city",etymology:"Possibly from a Portuguese sailor's navigational note 'Monte VI De O' (sixth hill from the east), or simply 'monte vide eu' (I saw a hill). Historians still argue. The hill is 139 metres tall.",lat:-34.90,lng:-56.19},
  {place:"Vladivostok",country:"RU",continent:"Asia",translation:"Rule the East",type:"City",etymology:"From Russian 'vladyet' (to rule) and 'vostok' (east). Named in 1860 to announce Russia's Pacific ambitions — a deliberate ideological statement embedded in geography.",lat:43.13,lng:131.91},
  {place:"Dar es Salaam",country:"TZ",continent:"Africa",translation:"House of Peace",type:"City",etymology:"From Arabic 'dar as-salam'. Named by Sultan Majid bin Said of Zanzibar who founded it in 1865 as a summer retreat. It remained Tanzania's capital until 1974 when Dodoma was designated instead.",lat:-6.79,lng:39.21},
  {place:"Kathmandu",country:"NP",continent:"Asia",translation:"Wooden Temple",type:"Capital city",etymology:"From Newari 'kastha' (wood) and 'mandapa' (pavilion). Named after the Kasthamandap — a rest house said to have been built from a single sacred tree around the 12th century. It still stands.",lat:27.71,lng:85.31},
  {place:"Casablanca",country:"MA",continent:"Africa",translation:"White House",type:"City",etymology:"Spanish name given by Portuguese explorers to what Berbers called Anfa. The whitewashed buildings inspired it — the same translation as the US President's residence, entirely by coincidence.",lat:33.59,lng:-7.62},
  {place:"Bamako",country:"ML",continent:"Africa",translation:"Crocodile River",type:"Capital city",etymology:"From Bambara 'bama' (crocodile) and 'ko' (river). Crocodiles were once common here and remain sacred in some nearby villages today, swimming alongside villagers without incident.",lat:12.65,lng:-8.00},
  {place:"Accra",country:"GH",continent:"Africa",translation:"Ants",type:"Capital city",etymology:"From the Akan word 'Nkran' for driver ants that infested the coastal area. British colonisers corrupted the name to Accra. The city was a major hub of the Atlantic slave trade in the 17th and 18th centuries.",lat:5.56,lng:-0.20},
  {place:"Tashkent",country:"UZ",continent:"Asia",translation:"Stone City",type:"Capital city",etymology:"From Turkic 'tash' (stone) and 'kent' (city). Occupied for over 2,200 years — its Silk Road position made it one of the most contested cities in medieval history.",lat:41.30,lng:69.24},
  {place:"Belo Horizonte",country:"BR",continent:"South America",translation:"Beautiful Horizon",type:"City",etymology:"Named for the panoramic mountain views. Purpose-built in the 1890s as Minas Gerais' new capital — Brazil's first planned modern city, designed half a century before Brasilia.",lat:-19.92,lng:-43.94},
  {place:"Windhoek",country:"NA",continent:"Africa",translation:"Windy Corner",type:"Capital city",etymology:"Afrikaans for 'windy corner'. Known to the Nama as 'Aris' and to the Herero as 'Otjomuise'. It became capital under German colonial rule in 1892 and was called the 'City of Wind' by settlers.",lat:-22.56,lng:17.08},
  {place:"Bishkek",country:"KG",continent:"Asia",translation:"Butter Churn",type:"Capital city",etymology:"From Kyrgyz for the wooden paddle used to churn mare's milk into kumiss — the traditional fermented drink. Renamed from Frunze after Kyrgyz independence from the Soviet Union in 1991.",lat:42.87,lng:74.59},
  {place:"Libreville",country:"GA",continent:"Africa",translation:"Free Town",type:"Capital city",etymology:"French for 'free town', founded in 1849 by enslaved people rescued from a Brazilian slave ship by the French navy — a direct echo of Sierra Leone's Freetown, founded by Britain 60 years earlier.",lat:0.39,lng:9.45},
  {place:"Asmara",country:"ER",continent:"Africa",translation:"They United the Women",type:"Capital city",etymology:"From Tigrinya, referring to four villages whose women came together to end a local conflict. The city is renowned for its exceptional 1930s Italian Art Deco architecture.",lat:15.34,lng:38.93},
  {place:"N'Djamena",country:"TD",continent:"Africa",translation:"Place of Rest",type:"Capital city",etymology:"From Arabic dialect meaning a resting place or watering hole. Renamed from Fort-Lamy in 1973. Sits at the confluence of the Chari and Logone rivers.",lat:12.11,lng:15.04},
  {place:"Paramaribo",country:"SR",continent:"South America",translation:"Flower Town on the Sea",type:"Capital city",etymology:"From Carib indigenous language. The city has a remarkably intact Dutch colonial wooden architecture district — a UNESCO World Heritage Site in a country most people couldn't locate on a map.",lat:5.85,lng:-55.20},
  {place:"Antananarivo",country:"MG",continent:"Africa",translation:"City of the Thousand Warriors",type:"Capital city",etymology:"From Malagasy 'tanana' (town) and 'arivo' (thousand). Named after the thousand soldiers sent by King Andrianjaka to guard the hilltop when he established his capital around 1610.",lat:-18.91,lng:47.54},
  {place:"Maseru",country:"LS",continent:"Africa",translation:"Place of Red Sandstone",type:"Capital city",etymology:"From Sesotho, referring to the distinctive red sandstone in the area. Lesotho is one of only three countries entirely encircled by a single other nation — South Africa.",lat:-29.32,lng:27.48},
  {place:"Funafuti",country:"TV",continent:"Oceania",translation:"Banana Woman",type:"Capital city",etymology:"From a Tuvaluan legend about a woman transformed into a banana plant. The atoll sits barely two metres above sea level. Tuvalu has agreements with Australia and New Zealand to relocate its entire population as sea levels rise.",lat:-8.52,lng:179.20},
  {place:"Lome",country:"TG",continent:"Africa",translation:"Among the Alo Trees",type:"Capital city",etymology:"From Ewe 'alo me' (among the alo trees). The only African capital that shares a land border directly with another country at its western edge — you can walk into Ghana from the city centre.",lat:6.14,lng:1.22},
  {place:"Port-au-Prince",country:"HT",continent:"North America",translation:"Port of the Prince",type:"Capital city",etymology:"Named after a French vessel called 'Le Prince' that anchored in the harbour in the early 18th century. Haiti became the first Black republic in the world following its revolution against France in 1804.",lat:18.54,lng:-72.34},
  {place:"Niamey",country:"NE",continent:"Africa",translation:"I am tired",type:"Capital city",etymology:"One account says a hunter resting on the riverbank said 'I am tired' in the Djerma language and the spot took his words as its name. Niger is the world's largest landlocked country by area.",lat:13.51,lng:2.12},
  {place:"Yamoussoukro",country:"CI",continent:"Africa",translation:"City of Yamousso",type:"Capital city",etymology:"Named after Queen Yamousso of the Baoule people. Made capital in 1983 by President Houphouet-Boigny who was born there. Home to the Basilica of Our Lady of Peace — larger than St Peter's in Rome.",lat:6.82,lng:-5.27},
  {place:"Djibouti City",country:"DJ",continent:"Africa",translation:"Land of the Djinn",type:"Capital city",etymology:"Possibly from Afar 'gabouti' (a type of plate) or a reference to spirits. One of the world's hottest inhabited cities, sitting at the entrance to the Red Sea where 20% of global maritime trade passes.",lat:11.59,lng:43.15},
  {place:"Valletta",country:"MT",continent:"Europe",translation:"City built by gentlemen for gentlemen",type:"Capital city",etymology:"Named after Jean Parisot de Valette, who founded it after repelling the Great Ottoman Siege of 1565. The quote was his own. At just 0.8 km2, it is the European Union's smallest capital city.",lat:35.90,lng:14.51},
  {place:"Nur-Sultan",country:"KZ",continent:"Asia",translation:"Light Sultan",type:"Capital city",etymology:"Renamed from Astana ('capital' in Kazakh) in 2019 after President Nursultan Nazarbayev. It reverted to Astana in 2022 after Nazarbayev lost power — one of history's faster un-namings.",lat:51.18,lng:71.45},
  {place:"Dushanbe",country:"TJ",continent:"Asia",translation:"Monday",type:"Capital city",etymology:"From Tajik for Monday. The city grew from a weekly market town that held its bazaar on Mondays. One of very few capital cities named after a day of the week.",lat:38.56,lng:68.77},
  {place:"Ashgabat",country:"TM",continent:"Asia",translation:"City of Love",type:"Capital city",etymology:"From Persian 'ashq' (love) and 'abad' (city). Holds a Guinness World Record for the world's highest density of white marble buildings. Almost entirely destroyed by an earthquake in 1948.",lat:37.96,lng:58.33},
  {place:"Thimphu",country:"BT",continent:"Asia",translation:"Flat Stone",type:"Capital city",etymology:"From Dzongkha, possibly meaning flat stone or dissolving highland. One of the few capital cities without traffic lights — the government removed them after citizens found them impersonal.",lat:27.47,lng:89.64},
  {place:"Nuku'alofa",country:"TO",continent:"Oceania",translation:"Abode of Love",type:"Capital city",etymology:"From Tongan 'nuku' (abode) and 'alofa' (love). Capital of Tonga, the last Polynesian monarchy. 'Alofa' encompasses love, compassion, and generosity — central values in Tongan culture.",lat:-21.14,lng:-175.20},
  {place:"Nassau",country:"BS",continent:"North America",translation:"Wet Land",type:"Capital city",etymology:"Named after William III, Prince of Orange-Nassau. Nassau itself comes from a German town meaning wet land. The Bahamas were the base of pirate Blackbeard and his Flying Gang in the early 1700s.",lat:25.05,lng:-77.35},
  {place:"Yerevan",country:"AM",continent:"Asia",translation:"It Appeared",type:"Capital city",etymology:"From Armenian 'yerevats' (it appeared) — Noah reportedly saw Mount Ararat appear through the receding floodwaters. Founded in 782 BC, it is one of the world's oldest continuously inhabited cities.",lat:40.18,lng:44.51},
  {place:"Kinshasa",country:"CD",continent:"Africa",translation:"The Place That Swallowed the Island",type:"Capital city",etymology:"From the Lingala of the Teke people. Renamed from Leopoldville in 1966. With over 17 million people, it is the world's largest Francophone city, facing Brazzaville across the river — the world's closest pair of capitals.",lat:-4.44,lng:15.27},
  {place:"Baku",country:"AZ",continent:"Asia",translation:"City of Winds",type:"Capital city",etymology:"From Persian 'bad-kube' — city where wind strikes. Baku sits on the Absheron Peninsula, one of the windiest places on Earth, and by 1901 was producing half the world's oil supply.",lat:40.41,lng:49.87},
  {place:"Muscat",country:"OM",continent:"Asia",translation:"Hidden Anchorage",type:"Capital city",etymology:"From Arabic 'masqat' — a sheltered harbour hidden from open sea. Oman's capital controlled Indian Ocean trade routes for centuries and is one of the Arabian Peninsula's oldest settled areas.",lat:23.58,lng:58.59},
  {place:"Oslo",country:"NO",continent:"Europe",translation:"Mouth of the Lo River",type:"Capital city",etymology:"From Old Norse for river mouth. Renamed Christiania by King Christian IV after a fire in 1624. It didn't become Oslo again until 1925 — the name change took 301 years to reverse.",lat:59.91,lng:10.75},
  {place:"Zagreb",country:"HR",continent:"Europe",translation:"Behind the Hill",type:"Capital city",etymology:"From Croatian 'za' (behind) and 'greb' (embankment). One legend says a thirsty soldier plunged his sabre into the earth crying 'Zagrabi!' (scoop it up!) — and water sprang forth.",lat:45.81,lng:15.98},
  {place:"Helsinki",country:"FI",continent:"Europe",translation:"Rapid of the Hels People",type:"Capital city",etymology:"Named after the Hels, a Swedish-speaking tribe, and 'fors' (waterfall/rapid) — corrupted over centuries to 'sinki'. Sweden founded the city in 1550. Finland remained part of Sweden for nearly 700 years.",lat:60.17,lng:24.94},
  {place:"Rio de Janeiro",country:"BR",continent:"South America",translation:"River of January",type:"City",etymology:"Portuguese explorers arrived in Guanabara Bay in January 1502 and mistook the bay for a river mouth. They wrote down 'River of January' and sailed on. There is no river. The name outlasted the mistake by 500 years.",lat:-22.91,lng:-43.17},
  {place:"Colorado",country:"US",continent:"North America",translation:"Coloured Red",type:"River and state",etymology:"Spanish explorers named the river for the reddish-brown sediment carried from the Colorado Plateau. Over six million years, that same river carved the Grand Canyon — roughly one centimetre per century.",lat:36.10,lng:-112.10},
  {place:"Mississippi",country:"US",continent:"North America",translation:"Great River",type:"River and state",etymology:"From Ojibwe 'misi-ziibi' — 'misi' (great) and 'ziibi' (river). At 3,730 km it drains about 40% of the continental United States. Mark Twain called it 'not a commonplace river but on the contrary remarkable in all ways'.",lat:29.15,lng:-89.25},

let map,guessMarker,answerMarker,guessLine;
let currentPuzzle=null,guessLatLng=null,confirmed=false,hintUsed=null,lastScore=null;
let mode='daily',practiceUsed=[];

function getStreak(){try{return JSON.parse(localStorage.getItem('etymap_streak')||'{"count":0,"lastDate":""}');}catch{return{count:0,lastDate:""};}}
function saveStreak(s){localStorage.setItem('etymap_streak',JSON.stringify(s));}
function getPuzzleNum(){const t=new Date();t.setHours(0,0,0,0);const l=new Date(LAUNCH_DATE);l.setHours(0,0,0,0);return Math.floor((t-l)/86400000)+1;}
function markDone(won){const today=getTodayStr();const s=getStreak();if(s.lastDate===today)return s.count;const n=won?s.count+1:0;saveStreak({count:n,lastDate:today});return n;}
function renderStreak(){const s=getStreak();document.getElementById('streak-badge').textContent=s.count>0?'🔥 '+s.count:'';}
function getTodayStr(){const d=new Date();return d.getFullYear()+'-'+(d.getMonth()+1)+'-'+d.getDate();}
function dateHash(s){let h=0;for(let i=0;i<s.length;i++)h=Math.imul(31,h)+s.charCodeAt(i)|0;return Math.abs(h);}

function initMap(){
  map=L.map('map',{zoomControl:true,minZoom:2}).setView([20,10],2);
  L.tileLayer('https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}{r}.png',{attribution:'© OpenStreetMap © CARTO',subdomains:'abcd',maxZoom:19}).addTo(map);
  map.on('click',e=>{if(!confirmed)placePin(e.latlng);});
}
function placePin(latlng){
  guessLatLng=latlng;
  if(guessMarker)map.removeLayer(guessMarker);
  guessMarker=L.marker(latlng,{icon:L.divIcon({className:'',html:'<div class="guess-dot"></div>',iconSize:[14,14],iconAnchor:[7,7]})}).addTo(map);
  document.getElementById('pin-msg').textContent='Happy with your pin?';
  document.getElementById('confirm-btn').style.display='block';
}
function useHint(type){
  if(hintUsed||confirmed)return;
  hintUsed=type;
  document.getElementById('btn-continent').disabled=true;
  document.getElementById('btn-country').disabled=true;
  const val=type==='continent'?'📍 '+currentPuzzle.continent:'🌍 '+(COUNTRIES[currentPuzzle.country]||currentPuzzle.country);
  document.getElementById('hint-shown').textContent=val;
}
function haversine(a,b,c,d){const R=6371,dL=(c-a)*Math.PI/180,dG=(d-b)*Math.PI/180,e=Math.sin(dL/2)**2+Math.cos(a*Math.PI/180)*Math.cos(c*Math.PI/180)*Math.sin(dG/2)**2;return R*2*Math.atan2(Math.sqrt(e),Math.sqrt(1-e));}
function distScore(km){return km<=50?4500:Math.max(0,Math.round(4500*(1-(km-50)/(10000-50))));}
function inCountry(lat,lng,code){const b=BOUNDS[code];return b?lat>=b[0]&&lng>=b[1]&&lat<=b[2]&&lng<=b[3]:false;}
function bearing(a,b,c,d){const dG=(d-b)*Math.PI/180,y=Math.sin(dG)*Math.cos(c*Math.PI/180),x=Math.cos(a*Math.PI/180)*Math.sin(c*Math.PI/180)-Math.sin(a*Math.PI/180)*Math.cos(c*Math.PI/180)*Math.cos(dG);return((Math.atan2(y,x)*180/Math.PI)+360)%360;}
function bearingArrow(d){return['↑','↗','→','↘','↓','↙','←','↖'][Math.round(d/45)%8];}
function scoreLabel(n){if(n>=4800)return'Perfect 🎯';if(n>=4000)return'Excellent ⭐';if(n>=2500)return'Good 👍';if(n>=1000)return'Close 🌍';return'Far off 😅';}
function scoreBar(n){const f=Math.round((n/5000)*5);return[0,1,2,3,4].map(i=>i<f?(i<3?'🟩':'🟨'):'⬜').join('');}

function confirmGuess(){
  if(!guessLatLng||confirmed)return;
  confirmed=true;
  const p=currentPuzzle;
  const km=haversine(guessLatLng.lat,guessLatLng.lng,p.lat,p.lng);
  const dPts=distScore(km);
  const cOk=inCountry(guessLatLng.lat,guessLatLng.lng,p.country);
  const cBonus=cOk?500:0;
  const hPen=hintUsed==='continent'?150:hintUsed==='country'?500:0;
  const total=Math.max(0,dPts+cBonus-hPen);
  lastScore={total,dPts,cBonus,hPen,km};
  if(answerMarker)map.removeLayer(answerMarker);
  answerMarker=L.marker([p.lat,p.lng],{icon:L.divIcon({className:'',html:'<div class="answer-dot"></div>',iconSize:[14,14],iconAnchor:[7,7]})}).addTo(map).bindPopup('<b>'+p.place+'</b>').openPopup();
  if(guessLine)map.removeLayer(guessLine);
  guessLine=L.polyline([guessLatLng,[p.lat,p.lng]],{color:'#f59e0b',weight:1.5,dashArray:'5,5',opacity:0.6}).addTo(map);
  map.fitBounds([[guessLatLng.lat,guessLatLng.lng],[p.lat,p.lng]],{padding:[60,60]});
  document.getElementById('result-score').textContent=total.toLocaleString();
  document.getElementById('result-label').textContent=scoreLabel(total);
  const kmStr=km<10?km.toFixed(1):Math.round(km).toLocaleString();
  const brng=bearing(guessLatLng.lat,guessLatLng.lng,p.lat,p.lng);
  const distLine=km<=50?'Within 50 km ✓':kmStr+' km '+bearingArrow(brng);
  let bd=dPts.toLocaleString()+' distance';
  bd+=cBonus?'\n+500 country bonus':'\n+0 country bonus';
  if(hPen)bd+='\n-'+hPen+' hint';
  bd+='\n'+distLine;
  document.getElementById('result-breakdown').textContent=bd;
  document.getElementById('result-place-name').textContent=p.place;
  document.getElementById('result-country').textContent=(COUNTRIES[p.country]||p.country)+' · '+p.type;
  document.getElementById('etymology-card').textContent=p.etymology;
  document.getElementById('bottom-pre').style.display='none';
  document.getElementById('result-panel').style.display='flex';
  document.getElementById('next-btn').style.display=mode==='practice'?'block':'none';
  if(mode==='daily'){markDone(true);renderStreak();}
}

function shareResult(){
  if(!lastScore||!currentPuzzle)return;
  const W=600,H=320;
  const canvas=document.createElement('canvas');
  canvas.width=W*2; canvas.height=H*2;
  const ctx=canvas.getContext('2d');
  ctx.scale(2,2);

  // Background
  ctx.fillStyle='#0f1117';
  ctx.fillRect(0,0,W,H);

  // Top accent stripe
  const stripe=ctx.createLinearGradient(0,0,W,0);
  stripe.addColorStop(0,'#4ade9e'); stripe.addColorStop(1,'#60a5fa');
  ctx.fillStyle=stripe; ctx.fillRect(0,0,W,3);

  // Card inner bg
  ctx.fillStyle='#181c27';
  ctx.beginPath(); ctx.roundRect(20,20,W-40,H-40,10); ctx.fill();

  // Logo
  ctx.font='bold 15px sans-serif';
  ctx.fillStyle='#e8eaf0'; ctx.textAlign='left';
  ctx.fillText('etym',32,50);
  const lw=ctx.measureText('etym').width;
  ctx.fillStyle='#4ade9e';
  ctx.fillText('ap',32+lw,50);

  // Puzzle number top right
  const numLabel=mode==='daily'?'#'+getPuzzleNum():'Practice';
  ctx.font='12px monospace';
  ctx.fillStyle='#4a4f60'; ctx.textAlign='right';
  ctx.fillText(numLabel,W-32,50);

  // Divider
  ctx.strokeStyle='rgba(255,255,255,0.06)'; ctx.lineWidth=1;
  ctx.beginPath(); ctx.moveTo(32,62); ctx.lineTo(W-32,62); ctx.stroke();

  // Subheading
  ctx.font='13px sans-serif'; ctx.fillStyle='#8b90a0'; ctx.textAlign='left';
  ctx.fillText('What place name means\u2026',32,82);

  // Translation clue — wrap if needed
  ctx.font='italic 26px sans-serif'; ctx.fillStyle='#e8eaf0';
  const clue='\u201c'+currentPuzzle.translation+'\u201d';
  const maxW=W-64;
  let words=clue.split(' '), line='', cy=114;
  for(const w of words){
    const test=line?line+' '+w:w;
    if(ctx.measureText(test).width>maxW&&line){ ctx.fillText(line,32,cy); line=w; cy+=34; }
    else { line=test; }
  }
  ctx.fillText(line,32,cy);

  // Score blocks
  const barY=H-80;
  const filled=Math.round((lastScore.total/5000)*5);
  for(let i=0;i<5;i++){
    ctx.fillStyle=i<filled?'#4ade9e':'#1e2333';
    ctx.beginPath(); ctx.roundRect(32+i*28,barY,22,22,4); ctx.fill();
  }

  // Score number
  const scoreStr=lastScore.total.toLocaleString();
  ctx.font='bold 22px monospace'; ctx.fillStyle='#4ade9e'; ctx.textAlign='left';
  ctx.fillText(scoreStr,32+5*28+12,barY+17);
  const scoreW=ctx.measureText(scoreStr+'  ').width;
  ctx.font='12px monospace'; ctx.fillStyle='#4a4f60';
  ctx.fillText('/ 5,000',32+5*28+12+scoreW,barY+17);

  // Distance line
  const kmStr=lastScore.km<=50?'Bullseye!':
    (lastScore.km<10?lastScore.km.toFixed(1):Math.round(lastScore.km).toLocaleString())+' km off';
  const hintNote=hintUsed?' \u00b7 hint used':'';
  ctx.font='12px sans-serif'; ctx.fillStyle='#8b90a0';
  ctx.fillText('\uD83D\uDCCD '+kmStr+hintNote,32,barY+42);

  // URL bottom right
  ctx.font='bold 12px sans-serif'; ctx.fillStyle='#4ade9e'; ctx.textAlign='right';
  ctx.fillText('konomira.github.io/etymap.html',W-32,H-28);

  // Bottom accent stripe
  ctx.fillStyle=stripe; ctx.fillRect(0,H-3,W,3);

  canvas.toBlob(blob=>{
    if(!blob)return;
    const file=new File([blob],'etymap-'+numLabel+'.png',{type:'image/png'});
    if(navigator.canShare&&navigator.canShare({files:[file]})){
      navigator.share({
        title:'Etymap '+numLabel,
        text:'\u201c'+currentPuzzle.translation+'\u201d \u2014 can you find it?',
        url:'https://konomira.github.io/etymap.html',
        files:[file]
      }).catch(()=>downloadCard(canvas,numLabel));
    } else {
      downloadCard(canvas,numLabel);
    }
  },'image/png');
}

function downloadCard(canvas,label){
  const a=document.createElement('a');
  a.href=canvas.toDataURL('image/png');
  a.download='etymap-'+label+'.png'; a.click();
  const t=document.getElementById('share-toast');
  t.textContent='Card saved \u2013 share it!';
  t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'),2500);
}


function loadPuzzle(idx){
  currentPuzzle=PUZZLES[idx];
  guessLatLng=null;confirmed=false;hintUsed=null;lastScore=null;
  if(guessMarker){map.removeLayer(guessMarker);guessMarker=null;}
  if(answerMarker){map.removeLayer(answerMarker);answerMarker=null;}
  if(guessLine){map.removeLayer(guessLine);guessLine=null;}
  document.getElementById('clue-text').textContent='"'+currentPuzzle.translation+'"';
  document.getElementById('clue-type').textContent=currentPuzzle.type;
  document.getElementById('hint-shown').textContent='';
  document.getElementById('btn-continent').disabled=false;
  document.getElementById('btn-country').disabled=false;
  document.getElementById('confirm-btn').style.display='none';
  document.getElementById('pin-msg').textContent='Click the map to place your pin';
  document.getElementById('bottom-pre').style.display='flex';
  document.getElementById('result-panel').style.display='none';
  document.getElementById('next-btn').style.display='none';
  map.setView([20,10],2);
}

function setMode(m){
  mode=m;
  document.querySelectorAll('.mode-btn').forEach((b,i)=>b.classList.toggle('active',(i===0&&m==='daily')||(i===1&&m==='practice')));
  if(m==='daily'){
    document.getElementById('puzzle-num').textContent='#'+getPuzzleNum();
    loadPuzzle(dateHash(getTodayStr())%PUZZLES.length);
  } else {
    document.getElementById('puzzle-num').textContent='Practice';
    practiceUsed=[];
    loadRandomPuzzle();
  }
}
function loadRandomPuzzle(){
  if(practiceUsed.length>=PUZZLES.length)practiceUsed=[];
  let idx;do{idx=Math.floor(Math.random()*PUZZLES.length);}while(practiceUsed.includes(idx));
  practiceUsed.push(idx);loadPuzzle(idx);
}
